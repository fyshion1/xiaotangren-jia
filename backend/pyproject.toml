[project]
name = "xiaotangren-backend"
version = "0.1.0"
description = "小糖人之家 后端服务（FastAPI + 多路模型切换 + 多模态）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "websockets>=15,<17",
    "ormsgpack>=1.7,<2",
    "async-timeout>=4,<6",
    "pydantic>=2.7",
    # Installed into the runner's interpreter; features import the standalone SDK,
    # never app.*. Executing tools remains the feature process's responsibility.
    "xiaotangren-tool-runtime==0.1.0",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "edge-tts>=7.2",
    "piper-tts>=1.8",
    "pillow>=10.3",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "xlrd>=2.0.1",
    # 功能循环进程的「查存活 / 停掉」靠它（Windows 没有 os.kill(pid, 15)，缺了 psutil
    # 停止功能会直接 WinError 87）。
    "psutil>=6.0",
]

[project.optional-dependencies]
# 记忆 RAG 的本地向量引擎（§9.2.1）。会拉 torch，体积大，所以不默认装；
# 装了才有语义检索，没装时记忆仍可用（关键词兜底）。
#   uv pip install --python backend/.venv/Scripts/python.exe -e "backend[memory]"
memory = [
    "sentence-transformers>=3.0",
]
dev = [
    "ruff>=0.6",
]
local-voice = [
    "sherpa-onnx>=1.13.8",
    "pilk>=0.2.4",
]

[tool.uv.sources]
xiaotangren-tool-runtime = { path = "../packages/tool-runtime", editable = true }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
