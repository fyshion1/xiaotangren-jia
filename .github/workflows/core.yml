name: Core checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --inexact --python 3.11
        working-directory: backend
      - run: .venv/bin/python -m unittest tests.test_feature_paths tests.test_component_inventory tests.test_plugin_management tests.test_personal_space_plugins -q
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
