<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <script>try{var p=localStorage.getItem("xtr.visual.palette");if(p==="rose"||p==="cream"||p==="starlight")document.documentElement.dataset.palette=p;var t=localStorage.getItem("xtr.theme");document.documentElement.classList.toggle("dark",t==="dark"||(!t&&matchMedia("(prefers-color-scheme:dark)").matches))}catch(e){}</script>
    <style>html{background:#fff9fc}html[data-palette="cream"]{background:#fbf6ed}html[data-palette="starlight"]{background:#f8f6fd}html.dark{background:#251e2b}html.dark[data-palette="cream"]{background:#24201c}html.dark[data-palette="starlight"]{background:#1e1e2d}body{background:inherit}</style>
    <title>糖人之家</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
