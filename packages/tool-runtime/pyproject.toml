[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaotangren-tool-runtime"
version = "0.1.0"
description = "Process-local, policy-checked tools for Xiaotangren adapters"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3"]

[tool.setuptools.packages.find]
where = ["src"]
